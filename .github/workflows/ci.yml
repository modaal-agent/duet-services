# The package's own gate. The manifest resolves `duet` by URL at an exact tag,
# so there is ONE checkout — this repo — and SwiftPM fetches the framework
# itself.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # Same two lanes as the duet repo's workflow (see its comment for the full
    # rationale): macos-26 pinned to Xcode 26.6 = the verified GA floor,
    # xcode-27 = the newest line (image default is the pin).
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macos-26
            xcode: "26.6"
          - image: xcode-27
            xcode: ""
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Build + test
        id: tests
        run: swift test
      - name: Job summary
        if: always()
        run: |
          {
            echo "### swift · ${{ matrix.image }} — ${{ steps.tests.outcome == 'success' && '✅ passed' || '❌ failed' }}"
            echo ""
            echo "- toolchain: $(xcodebuild -version | tr '\n' ' ')"
            echo "- swift: $(swift --version 2>&1 | head -1)"
            echo "- lane: ${{ matrix.xcode != '' && 'the GA floor (pinned)' || 'the newest proven line (image default)' }}"
            echo "- builds the products against the pinned duet tag; runs the service + telemetry suites"
          } >> "$GITHUB_STEP_SUMMARY"

  kotlin:
    # macOS: the KMP module declares apple targets (macosArm64/ios*) — a Linux
    # host would silently disable them. Pure KMP, no Android SDK needed. The
    # jvmTest suite includes the twin-contract fixture check: the committed
    # fixtures under contracts/telemetry-twin must carry exactly the Kotlin
    # encoders' output (the swift job's TelemetryTests read the same files).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Kotlin half (KMP suite)
        id: tests
        run: cd kotlin && ./gradlew build --console=plain
      - name: Job summary
        if: always()
        run: |
          {
            echo "### kotlin — ${{ steps.tests.outcome == 'success' && '✅ passed' || '❌ failed' }}"
            echo ""
            echo "- jdk: $(java -version 2>&1 | head -1)"
            echo "- suites: \`:telemetry\` KMP build + jvmTest (grammar pins, fan-out receipts, twin-contract fixtures)"
          } >> "$GITHUB_STEP_SUMMARY"

  # The iOS compile gate: the swift job's `swift test` runs on macOS, so
  # every `#if os(iOS)` file — the audio-session port, FakeAudioSession, the
  # APNS half of InboundAppServicesWorker — is invisible to it. Build-only for a
  # simulator destination; the logical tests run on the host lanes above.
  ios-build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the package for iOS Simulator
        run: |
          xcodebuild build \
            -scheme duet-services-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation

  # The generated-code staleness gate: files under Generated/ are build
  # products carrying a fingerprint block (bundle tag, generator config,
  # SHA-256 per scanned input, SHA-256 of the body). `--check` downloads the
  # mock-templates CLI (kilobytes, checksum-pinned), clones the pinned duet
  # tag to put the recorded inputs on disk, and re-hashes them plus the body
  # — no Sourcery run, no template compile. A changed input, a source file
  # added after generation, and a hand-edit all fail it.
  codegen:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate the generated code's fingerprints
        run: scripts/generate-mocks.sh --check
